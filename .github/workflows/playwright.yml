name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: derby
          POSTGRES_PASSWORD: derby
          POSTGRES_DB: pinewood_derby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U derby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values for the throwaway CI database and API server.
      DATABASE_URL: postgresql://derby:derby@localhost:5432/pinewood_derby
      API_BEARER_TOKEN: ci-test-token
      NEXT_PUBLIC_DERBY_API_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix server
        npm ci --prefix app
    - name: Set up database
      working-directory: server
      run: |
        npx prisma generate
        npx prisma migrate deploy
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # playwright.config.ts builds and starts the API server and the web app.
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
